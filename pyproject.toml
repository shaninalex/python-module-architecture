[project]
name = "blog"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shaninalex", email = "shanin.x@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncclick>=8.4.2.1",
    "asyncpg>=0.31.0",
    "click>=8.5.0",
    "faker==40.39.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.13",
    "punq>=0.8.0",
    "python-multipart>=0.0.32",
    "python-slugify>=9.1.0",
    "pyyaml>=6.0.3",
    "routes>=2.5.1",
    "sqlalchemy==2.0.54",
    "starlette>=1.6.0",
    "uvicorn==0.53.0",
]

[project.scripts]
blog = "blog.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

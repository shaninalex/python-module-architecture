[project]
name = "market"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shaninalex", email = "shanin.x@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "databases[asyncpg]>=0.9.0",
    "jinja2>=3.1.6",
    "punq>=0.8.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
market = "market:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

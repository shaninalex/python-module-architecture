{% macro Footer() %}
<footer class="py-3 border-top mt-5">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
            <p class="col-md-4 mb-0 text-body-secondary">© 2026 BuyShoes</p>

            <a class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
               href="{{ url_for('home') }}">
                <img src="{{ url_for('static', path='images/logo.png') }}" style="width:2rem"/>
            </a>

            <ul class="nav col-md-4 justify-content-end">
                <li class="nav-item">
                    <a class="nav-link px-2 text-body-secondary" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2 text-body-secondary" href="{{ url_for('contact') }}">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2 text-body-secondary" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2 text-body-secondary" href="{{ url_for('terms_conditions') }}">Terms</a>
                </li>
            </ul>
        </div>
    </div>
</footer>
{% endmacro %}
